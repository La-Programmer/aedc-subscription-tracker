version: '2'

services:
    # flask server
    flask-server:
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./Dockerfile
        expose:
            - 5000
        env_file:
          - ./.env

    # celery worker
    celery-worker:
        restart: unless-stopped
        build:
            context: .
            dockerfile: ./Dockerfile
        env_file:
          - ./.env
        depends_on:
            - flask-server
            - redis

    # redis server
    redis:
        restart: unless-stopped
        image: redis:7.0.5-alpine 
        expose:
            - 6379
